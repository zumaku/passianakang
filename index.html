<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passiana Kang - Visualisasi Silsilah Keluarga Interaktif</title>
  <meta name="description" content="Aplikasi visualisasi dan manajemen Silsilah Keluarga (Family Tree) interaktif berbasis web menggunakan FamilyTree.js" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Navbar Header -->
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="git-fork"></i>
        </div>
        <div>
          <h1 class="brand-title">Passiana Kang</h1>
          <p class="brand-subtitle">Visualisasi Silsilah Keluarga Interaktif</p>
        </div>
      </div>

      <!-- Search & Main Actions -->
      <div class="nav-actions">
        <div class="search-box">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Cari nama anggota..." />
        </div>

        <button id="btnAddMember" class="btn btn-primary">
          <i data-lucide="user-plus"></i> Tambah Anggota
        </button>

        <button id="btnExportJSON" class="btn btn-secondary" title="Unduh data JSON">
          <i data-lucide="download"></i> JSON
        </button>

        <button id="btnImportJSON" class="btn btn-secondary" title="Impor dari file JSON">
          <i data-lucide="upload"></i> Impor
        </button>
        <input type="file" id="fileInputJSON" accept=".json" style="display: none;" />

        <button id="btnExportPNG" class="btn btn-secondary" title="Ekspor ke Gambar PNG">
          <i data-lucide="image"></i> PNG
        </button>

        <button id="btnExportPDF" class="btn btn-secondary" title="Ekspor ke Dokumen PDF">
          <i data-lucide="file-text"></i> PDF
        </button>

        <button id="btnResetData" class="btn btn-secondary" title="Kembalikan ke Data Contoh">
          <i data-lucide="rotate-ccw"></i> Reset
        </button>
      </div>
    </header>

    <!-- Main Canvas View -->
    <main class="main-content">
      <div id="treeCanvas"></div>

      <!-- Floating Controls -->
      <div class="floating-controls">
        <div class="control-group">
          <button id="btnZoomIn" class="icon-btn" title="Perbesar (Zoom In)">
            <i data-lucide="zoom-in"></i>
          </button>
          <button id="btnZoomOut" class="icon-btn" title="Perkecil (Zoom Out)">
            <i data-lucide="zoom-out"></i>
          </button>
          <button id="btnFitScreen" class="icon-btn" title="Paskan ke Layar">
            <i data-lucide="maximize-2"></i>
          </button>
        </div>
        <div class="control-group" style="padding: 6px 12px; font-size: 11px; color: var(--text-muted);">
          Total: <span id="statTotalMembers" style="font-weight: 700; color: #fff; margin-left: 4px;">0</span> Anggota
        </div>
      </div>

      <!-- Detail Slide-Over Panel -->
      <aside id="detailPanel" class="detail-panel">
        <div class="panel-header">
          <span class="panel-title">Detail Anggota</span>
          <button id="btnCloseDetail" class="icon-btn">&times;</button>
        </div>

        <div class="panel-body">
          <div class="profile-card">
            <img id="detailAvatar" class="profile-avatar" src="" alt="Avatar" />
            <h2 id="detailName" class="profile-name">-</h2>
            <p id="detailTitle" class="profile-title">-</p>
            <span id="detailGenderBadge" class="badge badge-blue">-</span>
          </div>

          <div class="info-group">
            <div class="info-label">Informasi Kelahiran</div>
            <div id="detailBirthDate" class="info-val">-</div>
            <div id="detailDeathDate" class="info-val" style="color: #f87171;"></div>
          </div>

          <div class="info-group">
            <div class="info-label">Pekerjaan / Status</div>
            <div id="detailJob" class="info-val">-</div>
          </div>

          <div class="info-group">
            <div class="info-label">Catatan Biografi</div>
            <div id="detailBio" class="info-val">-</div>
          </div>

          <div class="section-label">Orang Tua</div>
          <ul id="detailParentsList" class="relation-list"></ul>

          <div class="section-label">Pasangan</div>
          <ul id="detailSpousesList" class="relation-list"></ul>

          <div class="section-label">Anak-Anak</div>
          <ul id="detailChildrenList" class="relation-list"></ul>
        </div>

        <div class="panel-footer">
          <button id="btnEditMember" class="btn btn-primary">
            <i data-lucide="edit"></i> Edit
          </button>
          <button id="btnDeleteMember" class="btn btn-danger">
            <i data-lucide="trash-2"></i> Hapus
          </button>
        </div>
      </aside>
    </main>

    <!-- Modal Form Tambah / Edit Anggota -->
    <div id="memberModal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <h3 id="memberModalTitle" class="modal-title">Tambah Anggota Keluarga</h3>
          <button id="btnCloseModal" class="icon-btn">&times;</button>
        </div>

        <form id="memberForm">
          <div class="modal-body">
            <input type="hidden" id="memberId" />
            
            <div class="form-grid">
              <div class="form-group full-width">
                <label class="form-label" for="memberName">Nama Lengkap *</label>
                <input type="text" id="memberName" class="form-control" placeholder="Contoh: Raden Soetomo" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="memberGender">Jenis Kelamin</label>
                <select id="memberGender" class="form-control">
                  <option value="male">Pria</option>
                  <option value="female">Wanita</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="memberTitle">Peran / Gelar</label>
                <input type="text" id="memberTitle" class="form-control" placeholder="Contoh: Kakek, Ibu, Anak Sulung" />
              </div>

              <div class="form-group">
                <label class="form-label" for="memberBirthDate">Tanggal Lahir</label>
                <input type="date" id="memberBirthDate" class="form-control" />
              </div>

              <div class="form-group">
                <label class="form-label" for="memberDeathDate">Tanggal Wafat (opsional)</label>
                <input type="date" id="memberDeathDate" class="form-control" />
              </div>

              <div class="form-group full-width">
                <label class="form-label" for="memberJob">Pekerjaan / Status</label>
                <input type="text" id="memberJob" class="form-control" placeholder="Contoh: Dosen, Dokter, Pelajar" />
              </div>

              <div class="form-group full-width">
                <label class="form-label" for="memberImg">URL Foto / Avatar</label>
                <input type="url" id="memberImg" class="form-control" placeholder="https://..." />
              </div>

              <!-- Relasi -->
              <div class="form-group">
                <label class="form-label" for="memberFather">Ayah</label>
                <select id="memberFather" class="form-control">
                  <option value="">-- Tanpa Ayah --</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="memberMother">Ibu</label>
                <select id="memberMother" class="form-control">
                  <option value="">-- Tanpa Ibu --</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label class="form-label" for="memberSpouse">Pasangan (Suami / Istri)</label>
                <select id="memberSpouse" class="form-control">
                  <option value="">-- Tanpa Pasangan --</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label class="form-label" for="memberBio">Catatan Biografi / Bio</label>
                <textarea id="memberBio" class="form-control" placeholder="Tuliskan catatan singkat mengenai anggota keluarga ini..."></textarea>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" id="btnCancelForm" class="btn btn-secondary">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
